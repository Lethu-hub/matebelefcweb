{% extends "base.html" %}
{% load static %}

{% block content %}
<h2>Analytics Dashboard</h2>

<select id="players" multiple>
  {% for p in players %}
    <option value="{{ p.id }}">{{ p.first_name }} {{ p.surname }}</option>
  {% endfor %}
</select>

<select id="matches" multiple>
  {% for m in matches %}
    <option value="{{ m.match_id }}">
      {{ m.match_date }} ({{ m.season }})
    </option>
  {% endfor %}
</select>

<select id="seasons" multiple>
  {% for s in seasons %}
    <option value="{{ s }}">{{ s }}</option>
  {% endfor %}
</select>

<select id="event_types" multiple>
  {% for e in event_types %}
    <option value="{{ e }}">{{ e }}</option>
  {% endfor %}
</select>

<canvas id="chart"></canvas>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="{% static 'stats/js/analytics.js' %}"></script>
{% endblock %}
