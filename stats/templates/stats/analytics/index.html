{% extends "stats/base.html" %}
{% load static %}

{% block content %}
<h1>Analytics Dashboard</h1>

<!-- Include Choices.js CSS & JS -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/choices.min.css" />
<script src="https://cdn.jsdelivr.net/npm/choices.js/public/assets/scripts/choices.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
  body { font-family: Arial; }
  .section { margin-bottom: 50px; padding: 20px; border: 1px solid #ccc; border-radius: 8px; overflow-x: auto; }
  .filters label { display: block; margin-top: 10px; }
  .filters select { width: 100%; margin-top: 5px; }
  table { width: 100%; border-collapse: collapse; margin-top: 10px; }
  table th, table td { border: 1px solid #aaa; padding: 5px; text-align: left; }
</style>

<!-- ================= PLAYER SECTION ================= -->
<div class="section" id="player-section">
  <h2>Player Analytics</h2>
  <div class="filters">
    <label>Season:</label>
    <select id="player-season" multiple>
      {% for season in seasons %}
        <option value="{{ season }}">{{ season }}</option>
      {% endfor %}
    </select>

    <label>Player:</label>
    <select id="player-player" multiple>
      {% for player in players %}
        <option value="{{ player.id }}">{{ player.first_name }} {{ player.surname }}</option>
      {% endfor %}
    </select>

    <label>Match:</label>
    <select id="player-match" multiple>
      {% for match in matches %}
        <option value="{{ match.match_id }}">{{ match.match_date }} ({{ match.match_id }})</option>
      {% endfor %}
    </select>

    <label>Event Type:</label>
    <select id="player-event-type" multiple>
      {% for event_type in event_types %}
        <option value="{{ event_type }}">{{ event_type }}</option>
      {% endfor %}
    </select>

    <label>Chart Type:</label>
    <select id="player-chart-type">
      <option value="bar">Bar</option>
      <option value="line">Line</option>
      <option value="pie">Pie</option>
    </select>

    <button id="player-update">Update Player Analytics</button>
  </div>

  <h3>Data Table</h3>
  <table id="player-table">
    <thead>
      <tr>
        <th>Player</th>
        <th>Match</th>
        <th>Date</th>
        <th>Event Type</th>
        <th>Minute</th>
        <th>Season</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <canvas id="player-chart" height="300"></canvas>
</div>

<!-- ================= TEAM SECTION ================= -->
<div class="section" id="team-section">
  <h2>Team Analytics</h2>
  <div class="filters">
    <label>Season:</label>
    <select id="team-season" multiple>
      {% for season in seasons %}
        <option value="{{ season }}">{{ season }}</option>
      {% endfor %}
    </select>

    <label>Match:</label>
    <select id="team-match" multiple>
      {% for match in matches %}
        <option value="{{ match.match_id }}">{{ match.match_date }} ({{ match.match_id }})</option>
      {% endfor %}
    </select>

    <label>Players:</label>
    <select id="team-player" multiple>
      {% for player in players %}
        <option value="{{ player.id }}">{{ player.first_name }} {{ player.surname }}</option>
      {% endfor %}
    </select>

    <label>Event Type:</label>
    <select id="team-event-type" multiple>
      {% for event_type in event_types %}
        <option value="{{ event_type }}">{{ event_type }}</option>
      {% endfor %}
    </select>

    <label>Chart Type:</label>
    <select id="team-chart-type">
      <option value="bar">Bar</option>
      <option value="line">Line</option>
      <option value="pie">Pie</option>
    </select>

    <button id="team-update">Update Team Analytics</button>
  </div>

  <h3>Data Table</h3>
  <table id="team-table">
    <thead>
      <tr>
        <th>Player</th>
        <th>Match</th>
        <th>Date</th>
        <th>Event Type</th>
        <th>Minute</th>
        <th>Season</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <canvas id="team-chart" height="300"></canvas>
</div>

<!-- ================= METRICS SECTION ================= -->
<div class="section" id="metrics-section">
  <h2>Custom Metrics</h2>
  <div class="filters">
    <label>Metric:</label>
    <select id="metrics-metric">
      <option value="minute_hist">Minutes Histogram</option>
      <option value="minute_density">Minute Density (frequency density)</option>
      <option value="cumulative_by_player">Cumulative Events (by player over matches)</option>
      <option value="top_scorers">Top Scorers</option>
    </select>

    <label>Bins (histogram only):</label>
    <input id="metrics-bins" type="number" min="2" max="50" value="10">

    <label>Players:</label>
    <select id="metrics-player" multiple>
      {% for player in players %}
        <option value="{{ player.id }}">{{ player.first_name }} {{ player.surname }}</option>
      {% endfor %}
    </select>

    <label>Matches:</label>
    <select id="metrics-match" multiple>
      {% for match in matches %}
        <option value="{{ match.match_id }}">{{ match.match_date }} ({{ match.match_id }})</option>
      {% endfor %}
    </select>

    <button id="metrics-update">Update Metric</button>
  </div>

  <canvas id="metrics-chart" height="300"></canvas>
  <div id="metrics-table"></div>
</div>

<script>
  // ================= INIT MULTI-SELECTS =================
  const playerSeasonSelect = new Choices('#player-season', { removeItemButton: true });
  const playerPlayerSelect = new Choices('#player-player', { removeItemButton: true });
  const playerMatchSelect = new Choices('#player-match', { removeItemButton: true });
  const playerEventSelect = new Choices('#player-event-type', { removeItemButton: true });

  const teamSeasonSelect = new Choices('#team-season', { removeItemButton: true });
  const teamPlayerSelect = new Choices('#team-player', { removeItemButton: true });
  const teamMatchSelect = new Choices('#team-match', { removeItemButton: true });
  const teamEventSelect = new Choices('#team-event-type', { removeItemButton: true });

  // Add richer chart types to the selectors
  document.querySelectorAll('#player-chart-type, #team-chart-type').forEach(sel => {
    sel.innerHTML = `
      <option value="bar">Bar</option>
      <option value="line">Line</option>
      <option value="area">Area (filled line)</option>
      <option value="doughnut">Doughnut</option>
      <option value="radar">Radar</option>
      <option value="scatter">Scatter</option>
    `;
  });

  let playerChart = null;
  let teamChart = null;

  function generateColors(n, alpha=0.75) {
    const colors = [];
    for (let i = 0; i < n; i++) {
      const hue = Math.round((360 * i) / n);
      colors.push(`hsla(${hue}, 70%, 45%, ${alpha})`);
    }
    return colors;
  }

  function fetchData(section) {
    const season = Array.from(document.querySelector(`#${section}-season`).selectedOptions).map(o => o.value);
    const players = Array.from(document.querySelector(`#${section}-player`).selectedOptions).map(o => o.value);
    const matches = Array.from(document.querySelector(`#${section}-match`).selectedOptions).map(o => o.value);
    const events = Array.from(document.querySelector(`#${section}-event-type`).selectedOptions).map(o => o.value);
    const chartType = document.querySelector(`#${section}-chart-type`).value;

    const params = new URLSearchParams();
    season.forEach(s => params.append('seasons[]', s));
    players.forEach(p => params.append('players[]', p));
    matches.forEach(m => params.append('matches[]', m));
    events.forEach(e => params.append('event_types[]', e));

    fetch(`/stats/analytics/data/?${params.toString()}`)
      .then(res => res.json())
      .then(data => {
        buildTable(`${section}-table`, data);
        buildChart(`${section}-chart`, data, chartType, section, players, matches);
      });
  }

  function buildTable(tableId, data) {
    const tbody = document.getElementById(tableId).querySelector("tbody");
    tbody.innerHTML = "";
    data.forEach(row => {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${row.player}</td>
        <td>${row.match_id}</td>
        <td>${row.match_date}</td>
        <td>${row.event_type}</td>
        <td>${row.minute}</td>
        <td>${row.season}</td>
      `;
      tbody.appendChild(tr);
    });
  }

  function buildChart(canvasId, data, type, section, players, matches) {
    const ctx = document.getElementById(canvasId).getContext("2d");

    if (section === 'player' && playerChart) playerChart.destroy();
    if (section === 'team' && teamChart) teamChart.destroy();

    // Derived unique labels
    const uniquePlayers = Array.from(new Set(data.map(d => ({ id: d.player_id, name: d.player })))) ;
    const uniquePlayerNames = uniquePlayers.map(u => u.name);
    const uniqueMatches = Array.from(new Set(data.map(d => d.match_id)));

    let labels = [];
    const datasets = [];

    // If multiple players selected, group by player across matches
    if (players && players.length > 1) {
      labels = uniqueMatches;
      const colors = generateColors(players.length);
      players.forEach((pid, idx) => {
        const labelName = (data.find(d => d.player_id == pid) || {}).player || pid;
        const dataPoints = labels.map(matchId => data.filter(d => d.player_id == pid && d.match_id == matchId).length);
        datasets.push({ label: labelName, data: dataPoints, backgroundColor: colors[idx], borderColor: colors[idx].replace(/\,\s*[^,]+\)/, ', 1)') });
      });
    }
    // If multiple matches selected, group by match across players
    else if (matches && matches.length > 1) {
      labels = uniquePlayerNames;
      const colors = generateColors(matches.length);
      matches.forEach((mid, idx) => {
        const dataPoints = labels.map(pname => data.filter(d => d.match_id == mid && d.player == pname).length);
        datasets.push({ label: mid, data: dataPoints, backgroundColor: colors[idx], borderColor: colors[idx].replace(/\,\s*[^,]+\)/, ', 1)') });
      });
    }
    // Fallback: single-series showing minute values
    else {
      labels = data.map(d => d.player + ' (' + d.match_id + ')');
      const values = data.map(d => d.minute || 0);
      datasets.push({ label: 'Event Minutes', data: values, backgroundColor: generateColors(1)[0], borderColor: generateColors(1)[0].replace(/\,\s*[^,]+\)/, ', 1)') });
    }

    // For pie/doughnut: aggregate totals per dataset label
    if (type === 'doughnut' || type === 'pie') {
      const pieLabels = datasets.map(ds => ds.label);
      const pieData = datasets.map(ds => ds.data.reduce((a, b) => a + b, 0));
      const pieColors = generateColors(pieLabels.length, 0.85);
      const chart = new Chart(ctx, { type: type, data: { labels: pieLabels, datasets: [{ data: pieData, backgroundColor: pieColors }] }, options: { responsive: true } });
      if (section === 'player') playerChart = chart;
      if (section === 'team') teamChart = chart;
      return;
    }

    const chartConfig = {
      type: (type === 'area' ? 'line' : type),
      data: { labels: labels, datasets: datasets.map(ds => ({ ...ds, fill: (type === 'area'), tension: 0.3 })) },
      options: { responsive: true, plugins: { legend: { display: true }, tooltip: { enabled: true } }, scales: { y: { beginAtZero: true } } }
    };

    const chart = new Chart(ctx, chartConfig);
    if (section === 'player') playerChart = chart;
    if (section === 'team') teamChart = chart;
  }

  document.getElementById('player-update').addEventListener('click', () => fetchData('player'));
  document.getElementById('team-update').addEventListener('click', () => fetchData('team'));

  // METRICS HANDLERS
  const metricsPlayerSelect = new Choices('#metrics-player', { removeItemButton: true });
  const metricsMatchSelect = new Choices('#metrics-match', { removeItemButton: true });
  document.getElementById('metrics-update').addEventListener('click', updateMetric);

  let metricsChart = null;
  function updateMetric() {
    const metric = document.getElementById('metrics-metric').value;
    const bins = document.getElementById('metrics-bins').value;
    const players = Array.from(document.querySelector(`#metrics-player`).selectedOptions).map(o => o.value);
    const matches = Array.from(document.querySelector(`#metrics-match`).selectedOptions).map(o => o.value);

    const params = new URLSearchParams();
    params.append('metric', metric);
    players.forEach(p => params.append('players[]', p));
    matches.forEach(m => params.append('matches[]', m));
    if (metric === 'minutes_histogram') params.append('bins', bins);

    fetch(`/stats/analytics/metrics/?${params.toString()}`)
      .then(res => res.json())
      .then(payload => {
        const ctx = document.getElementById('metrics-chart').getContext('2d');
        if (metricsChart) metricsChart.destroy();

        if (metric === 'minute_hist') {
          // payload: { labels: [...], counts: [...] }
          metricsChart = new Chart(ctx, { type: 'bar', data: { labels: payload.labels, datasets: [{ label: 'Count', data: payload.counts, backgroundColor: generateColors(payload.labels.length) }] }, options: { responsive: true, plugins: { legend: { display: false } } } });
          document.getElementByminute_density') {
          // payload: { labels: [...], density: [...] }
          metricsChart = new Chart(ctx, { type: 'line', data: { labels: payload.labels, datasets: [{ label: 'Density', data: payload.density, borderColor: generateColors(1)[0], backgroundColor: generateColors(1)[0], fill: false, tension: 0.2 }] }, options: { responsive: true } });
          document.getElementById('metrics-table').innerHTML = '';
        } else if (metric === 'Id('metrics-table').innerHTML = '';
        } else if (metric === 'cumulative_by_player') {
          // payload: { labels: [...], datasets: [{label, data}, ...] }
          const colors = generateColors(payload.datasets.length);
          const datasets = payload.datasets.map((ds, i) => ({ label: ds.label, data: ds.data, borderColor: colors[i], backgroundColor: colors[i], fill: false, tension: 0.2 }));
          metricsChart = new Chart(ctx, { type: 'line', data: { labels: payload.labels, datasets }, options: { responsive: true, plugins: { legend: { display: true } } } });
          document.getElementById('metrics-table').innerHTML = '';
        } else if (metric === 'top_scorers') {
          // payload: { labels: [...], counts: [...] }
          const labels = payload.labels;
          const counts = payload.counts;
          metricsChart = new Chart(ctx, { type: 'bar', data: { labels: labels, datasets: [{ label: 'Goals', data: counts, backgroundColor: generateColors(labels.length) }] }, options: { responsive: true } });
          // also show a table
          let html = '<table><thead><tr><th>Player</th><th>Count</th></tr></thead><tbody>';
          labels.forEach((l, idx) => { html += `<tr><td>${l}</td><td>${counts[idx]}</td></tr>` });
          html += '</tbody></table>';
          document.getElementById('metrics-table').innerHTML = html;
        }
      });
  }

  // Initial load
  fetchData('player');
  fetchData('team');
  updateMetric();
</script>

{% endblock %}
